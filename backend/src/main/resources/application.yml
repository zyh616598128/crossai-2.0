server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: crossai-backend
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/crossai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: crossai
    password: crossaipass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: crossaipass
      database: 0
      timeout: 2000ms
  
  # Actuator
  actuator:
    endpoints:
      web:
        exposure:
          include: health,info,metrics

# Logging Configuration
logging:
  level:
    com.crossai: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# File Upload Configuration
file:
  upload:
    max-size: 10MB